<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get CarCat</title>
<meta name="robots" content="noindex" />
<script>
  (function () {
    var IOS = "https://apps.apple.com/gb/app/carcat-auto-services/id6756967222";
    var ANDROID = "https://play.google.com/store/apps/details?id=com.nematmirzayev.carcat";
    var ua = navigator.userAgent || "";
    var ipadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    if (/iPhone|iPad|iPod/i.test(ua) || ipadOS) location.replace(IOS);
    else if (/Android/i.test(ua)) location.replace(ANDROID);
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:#f5f5f4;color:#111}
  main{display:flex;flex-direction:column;align-items:center;gap:16px;padding:32px;text-align:center}
  h1{margin:0;font-size:24px}
  p{margin:0;color:#555}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  a{background:#111;color:#fff;text-decoration:none;padding:12px 20px;border-radius:14px;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Get CarCat</h1>
  <p>Choose your store:</p>
  <div class="row">
    <a href="https://apps.apple.com/gb/app/carcat-auto-services/id6756967222">App Store</a>
    <a href="https://play.google.com/store/apps/details?id=com.nematmirzayev.carcat">Google Play</a>
  </div>
</main>
</body>
</html>
